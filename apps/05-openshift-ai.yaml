apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openshift-ai
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    # TEMPLATE: Update this to point to your Git repository
    # The setup-gitops-repo.sh script will automatically set this from the cluster's Gitea route
    # If applying manually, replace https://gitea-gitea.apps.cluster-f4r9v.f4r9v.sandbox3548.opentlc.com with your cluster's Gitea URL:
    #   oc get route gitea -n gitea -o jsonpath='https://{.spec.host}'
    repoURL: https://gitea-gitea.apps.cluster-f4r9v.f4r9v.sandbox3548.opentlc.com/admin/playground-gitops.git
    targetRevision: main
    path: openshift-ai/manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-operators

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false
      - RespectIgnoreDifferences=true
      - SkipDryRunOnMissingResource=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  # Health assessment for custom resources
  ignoreDifferences:
    - group: datasciencecluster.opendatahub.io
      kind: DataScienceCluster
      jsonPointers:
        - /spec/components/*/managementState
        - /status
