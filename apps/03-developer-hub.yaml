apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: developer-hub
  namespace: openshift-gitops
spec:
  project: default

  source:
    # TEMPLATE: Update this to point to your Git repository
    # The setup-gitops-repo.sh script will automatically set this from the cluster's Gitea route
    # If applying manually, replace https://gitea-gitea.apps.cluster-mjs8r.mjs8r.sandbox5419.opentlc.com with your cluster's Gitea URL:
    #   oc get route gitea -n gitea -o jsonpath='https://{.spec.host}'
    repoURL: https://gitea-gitea.apps.cluster-mjs8r.mjs8r.sandbox5419.opentlc.com/admin/playground-gitops.git
    targetRevision: main
    path: developerhub/manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: rhdh

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  # Health assessment for custom resources
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: rhdh.redhat.com
      kind: Backstage
      jsonPointers:
        - /spec/monitoring
        - /spec/application/imagePullPolicy
        - /spec/application/resources
        - /status
