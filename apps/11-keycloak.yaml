apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    # TEMPLATE: Update this to point to your Git repository
    # The setup-gitops-repo.sh script will automatically set this from the cluster's Gitea route
    # If applying manually, replace https://gitea-gitea.apps.cluster-jstg2.jstg2.sandbox4273.opentlc.com with your cluster's Gitea URL:
    #   oc get route gitea -n gitea -o jsonpath='https://{.spec.host}'
    repoURL: https://gitea-gitea.apps.cluster-jstg2.jstg2.sandbox4273.opentlc.com/admin/playground-gitops.git
    targetRevision: main
    path: keycloak/manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  # Ignore operator-managed fields to prevent false OutOfSync status
  ignoreDifferences:
    - group: keycloak.org
      kind: KeycloakRealm
      jsonPointers:
        - /status
        - /spec/realm/clients
    - group: keycloak.org
      kind: Keycloak
      jsonPointers:
        - /status
    - group: keycloak.org
      kind: KeycloakClient
      jsonPointers:
        - /status
    - group: keycloak.org
      kind: KeycloakUser
      jsonPointers:
        - /status
