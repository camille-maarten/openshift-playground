apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: developer-hub
  namespace: openshift-gitops
spec:
  project: default

  source:
    # Update this to point to your Git repository
    repoURL: https://gitea-gitea.apps.cluster-g44r2.g44r2.sandbox5397.opentlc.com/admin/playground-gitops.git
    targetRevision: main
    path: developerhub/manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: rhdh

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  # Health assessment for custom resources
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
