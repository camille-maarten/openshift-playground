---
# Keycloak Client for Red Hat Developer Hub
apiVersion: keycloak.org/v1alpha1
kind: KeycloakClient
metadata:
  name: rhdh-client
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    app: keycloak
    client: rhdh
spec:
  realmSelector:
    matchLabels:
      app: keycloak
      realm: rhdh
  client:
    clientId: rhdh
    name: "Red Hat Developer Hub"
    description: "OIDC client for Red Hat Developer Hub authentication"
    # Client type and protocol
    protocol: openid-connect
    publicClient: false
    # Enable required flows
    directAccessGrantsEnabled: true
    standardFlowEnabled: true
    implicitFlowEnabled: false
    serviceAccountsEnabled: false
    # Authorization settings
    authorizationServicesEnabled: false
    # Redirect URIs - TEMPLATE: These will be updated by deploy script
    redirectUris:
      - "https://backstage-developer-hub-rhdh.apps-crc.testing/*"
      - "https://backstage-developer-hub-rhdh.apps-crc.testing/api/auth/oidc/handler/frame"
    # Web origins
    webOrigins:
      - "https://backstage-developer-hub-rhdh.apps-crc.testing"
    # Base URL
    baseUrl: "https://backstage-developer-hub-rhdh.apps-crc.testing"
    # Client authentication
    clientAuthenticatorType: client-secret
    # Default client scopes
    defaultClientScopes:
      - "profile"
      - "email"
      - "roles"
    # Optional client scopes
    optionalClientScopes:
      - "address"
      - "phone"
    # Protocol mappers for user attributes
    protocolMappers:
      - name: "username"
        protocol: "openid-connect"
        protocolMapper: "oidc-usermodel-property-mapper"
        consentRequired: false
        config:
          userinfo.token.claim: "true"
          user.attribute: "username"
          id.token.claim: "true"
          access.token.claim: "true"
          claim.name: "preferred_username"
          jsonType.label: "String"
      - name: "email"
        protocol: "openid-connect"
        protocolMapper: "oidc-usermodel-property-mapper"
        consentRequired: false
        config:
          userinfo.token.claim: "true"
          user.attribute: "email"
          id.token.claim: "true"
          access.token.claim: "true"
          claim.name: "email"
          jsonType.label: "String"
      - name: "full name"
        protocol: "openid-connect"
        protocolMapper: "oidc-full-name-mapper"
        consentRequired: false
        config:
          userinfo.token.claim: "true"
          id.token.claim: "true"
          access.token.claim: "true"
