---
# GitLab Minio Secret
# This secret is used by GitLab for object storage credentials
# Minio provides S3-compatible object storage for GitLab

apiVersion: v1
kind: Secret
metadata:
  name: gitlab-minio-secret
  namespace: gitlab-system
  labels:
    app: gitlab
    component: minio
type: Opaque
stringData:
  # Minio access key (username)
  accesskey: gitlab-minio

  # Minio secret key (password)
  secretkey: gitlab1234!
