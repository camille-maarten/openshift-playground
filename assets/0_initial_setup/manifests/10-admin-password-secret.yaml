---
# ArgoCD Admin Password Secret
# This secret sets the initial admin password for ArgoCD
# Default password: argo1234!
#
# To change the password:
# 1. Update the 'admin.password' value below
# 2. Apply this file: oc apply -f 10-admin-password-secret.yaml
# 3. Delete the ArgoCD server pod to restart it:
#    oc delete pod -l app.kubernetes.io/name=openshift-gitops-server -n openshift-gitops
#
# Note: The password must be bcrypt hashed. To generate a new hash:
# htpasswd -nbBC 10 "" your-password | tr -d ':\n' | sed 's/$2y/$2a/'
# OR use: argocd account bcrypt --password your-password

apiVersion: v1
kind: Secret
metadata:
  name: argocd-secret
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/name: argocd-secret
    app.kubernetes.io/part-of: argocd
type: Opaque
stringData:
  # Admin password (bcrypt hashed): argo1234!
  # Generated using: htpasswd -nbBC 10 "" argo1234! | tr -d ':\n' | sed 's/$2y/$2a/'
  admin.password: "$2a$10$hDj12/z/6/qM8yLLlH2gLee2hzL.6B0QYpFp5k7pmRVZKILvB5V4u"

  # Server signature key (auto-generated if not provided)
  # This is used to sign JWT tokens
  server.secretkey: "$(openssl rand -base64 32)"
