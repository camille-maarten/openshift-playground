---
apiVersion: apps.gitlab.com/v1beta1
kind: GitLab
metadata:
  name: gitlab
  namespace: gitlab-system
spec:
  # GitLab chart version
  chart:
    version: "7.7.0"
    values:
      # Global settings
      global:
        hosts:
          domain: apps.example.com  # Update this to match your OpenShift cluster domain
          https: true

        # Use OpenShift routes instead of Ingress
        ingress:
          enabled: false
          configureCertmanager: false

        # Initial root password
        initialRootPassword:
          secret: gitlab-initial-root-password
          key: password

        # Edition: ce (Community Edition) or ee (Enterprise Edition)
        edition: ce

        # Time zone
        time_zone: UTC

        # Email configuration (optional)
        # email:
        #   from: gitlab@example.com
        #   reply_to: noreply@example.com

        # SMTP settings (optional)
        # smtp:
        #   enabled: false

        # Container registry
        registry:
          enabled: true

        # GitLab Pages
        pages:
          enabled: false

        # Minio for object storage
        minio:
          enabled: true
          credentials:
            secret: gitlab-minio-secret

        # Grafana
        grafana:
          enabled: false

        # AppArmor (disabled for OpenShift)
        appConfig:
          enableUsagePing: false
          enableSeatLink: false

      # Nginx ingress controller (disabled, using OpenShift routes)
      nginx-ingress:
        enabled: false

      # Cert-manager (disabled, using OpenShift certs)
      certmanager:
        install: false

      # Prometheus (disabled if using OpenShift monitoring)
      prometheus:
        install: false

      # GitLab Runner
      gitlab-runner:
        install: true
        runners:
          config: |
            [[runners]]
              [runners.kubernetes]
                namespace = "gitlab-system"
                image = "alpine:latest"

      # GitLab components
      gitlab:
        # Webservice
        webservice:
          minReplicas: 1
          maxReplicas: 2
          resources:
            requests:
              cpu: 300m
              memory: 1.5Gi
            limits:
              cpu: 1
              memory: 2Gi
          workhorse:
            resources:
              requests:
                cpu: 100m
                memory: 100Mi
              limits:
                cpu: 200m
                memory: 200Mi

        # Sidekiq
        sidekiq:
          minReplicas: 1
          maxReplicas: 2
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: 500m
              memory: 1.5Gi

        # GitLab Shell
        gitlab-shell:
          minReplicas: 1
          maxReplicas: 2
          resources:
            requests:
              cpu: 100m
              memory: 100Mi
            limits:
              cpu: 200m
              memory: 200Mi

        # Gitaly
        gitaly:
          persistence:
            enabled: true
            size: 50Gi
            storageClass: ""  # Use default storage class
          resources:
            requests:
              cpu: 200m
              memory: 400Mi
            limits:
              cpu: 500m
              memory: 800Mi

        # Migrations
        migrations:
          enabled: true

      # PostgreSQL
      postgresql:
        install: true
        persistence:
          size: 8Gi
          storageClass: ""  # Use default storage class
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi

      # Redis
      redis:
        install: true
        persistence:
          size: 5Gi
          storageClass: ""  # Use default storage class
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi

      # Minio
      minio:
        persistence:
          size: 10Gi
          storageClass: ""  # Use default storage class
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi

      # Registry
      registry:
        enabled: true
        persistence:
          enabled: true
          size: 10Gi
          storageClass: ""  # Use default storage class
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi

      # Shared storage settings
      shared-secrets:
        enabled: true
        rbac:
          create: true
