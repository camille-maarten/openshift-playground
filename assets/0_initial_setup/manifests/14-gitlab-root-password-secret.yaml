---
# GitLab Root (Admin) Password Secret
# This secret sets the initial root password for GitLab
# Default password: gitlab1234!
#
# To change the password:
# 1. Update the 'password' value below
# 2. Apply this file: oc apply -f 14-gitlab-root-password-secret.yaml
# 3. Delete the GitLab webservice pods to restart them:
#    oc delete pod -l app=webservice -n gitlab-system
#
# Note: The password should be at least 8 characters

apiVersion: v1
kind: Secret
metadata:
  name: gitlab-initial-root-password
  namespace: gitlab-system
type: Opaque
stringData:
  # Root password (plain text): gitlab1234!
  password: gitlab1234!
