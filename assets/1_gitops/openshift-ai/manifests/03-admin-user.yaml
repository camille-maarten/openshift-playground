---
# Secret containing htpasswd for RHOAI admin user
# This secret is used by OpenShift OAuth to authenticate users
apiVersion: v1
kind: Secret
metadata:
  name: rhoai-htpasswd-secret
  namespace: openshift-config
  annotations:
    argocd.argoproj.io/sync-wave: "5"
type: Opaque
stringData:
  # admin:rhoai1234!
  # os-admin:openshift1234!
  # Generated with: htpasswd -nbB <username> <password>
  htpasswd: |
    admin:$2y$05$ra39wOW950ufzKuDrtgBTeQvbgxWCpsWB25n6tPPQtzqkemAMqWfO
    os-admin:$2y$05$qpiVuvnyl6ksVY2hzulv..XP6bqi8e6hE/GyE0SFaAuqFOcagwbQe
---
# Group for RHOAI administrators
apiVersion: user.openshift.io/v1
kind: Group
metadata:
  name: rhods-admins
  annotations:
    argocd.argoproj.io/sync-wave: "6"
users:
  - admin
  - os-admin
---
# ClusterRoleBinding to grant cluster-admin access to rhods-admins group
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rhods-admins-cluster-admin
  annotations:
    argocd.argoproj.io/sync-wave: "7"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: rhods-admins
---
# RoleBinding for dedicated-admins role in redhat-ods-applications namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rhods-admins-dedicated-admins
  namespace: redhat-ods-applications
  annotations:
    argocd.argoproj.io/sync-wave: "7"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: rhods-admins
