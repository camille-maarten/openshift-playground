# ============================================================================
# ArgoCD RBAC Configuration for OpenShift AI
# ============================================================================
#
# IMPORTANT: These RBAC resources are now managed in the initial setup phase
# (assets/0_initial_setup/manifests/12-argocd-openshift-ai-rbac.yaml)
# to avoid chicken-and-egg problems where ArgoCD needs permissions to grant
# itself permissions.
#
# The following resources are created during initial setup:
# - ClusterRole: argocd-openshift-ai-manager
# - ClusterRoleBinding: argocd-openshift-ai-manager
# - Role: argocd-openshift-config-manager (in openshift-config namespace)
# - RoleBinding: argocd-openshift-config-manager (in openshift-config namespace)
#
# DO NOT UNCOMMENT THE FOLLOWING RBAC RESOURCES - THEY ARE MANAGED EXTERNALLY
# ============================================================================

# The RBAC resources have been moved to:
# assets/0_initial_setup/manifests/12-argocd-openshift-ai-rbac.yaml
#
# This ensures ArgoCD has the necessary permissions before attempting to
# manage OpenShift AI resources, including secrets in the openshift-config
# namespace.
