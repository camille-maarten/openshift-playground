apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  name: app-config-rhdh
  namespace: rhdh
data:
  app-config-rhdh.yaml: |
    app:
      title: Red Hat Developer Hub
      baseUrl: ${RHDH_BASE_URL}

    organization:
      name: My Organization

    backend:
      auth:
        keys:
          - secret: ${BACKEND_SECRET}
        externalAccess:
          - type: static
            options:
              token: ${BACKEND_SECRET}
              subject: external-static-token
      baseUrl: ${RHDH_BASE_URL}
      cors:
        origin: ${RHDH_BASE_URL}
        methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
        credentials: true
      database:
        client: pg
        connection:
          host: ${POSTGRES_HOST}
          port: ${POSTGRES_PORT}
          user: ${POSTGRES_USER}
          password: ${POSTGRES_PASSWORD}

    # Authentication configuration
    auth:
      # Environment variable for the base URL
      environment: production
      # Authentication providers
      providers:
        # Keycloak OIDC provider
        oidc:
          production:
            metadataUrl: ${KEYCLOAK_BASE_URL}/realms/rhdh/.well-known/openid-configuration
            clientId: ${KEYCLOAK_CLIENT_ID}
            clientSecret: ${KEYCLOAK_CLIENT_SECRET}
            prompt: auto
            # Callback URL for OIDC authentication
            callbackUrl: ${RHDH_BASE_URL}/api/auth/oidc/handler/frame
            additionalScopes:
              - profile
              - email
            signIn:
              resolvers:
                # Resolves the user entity from the Keycloak token
                - resolver: preferredUsernameMatchingUserEntityName

        # OpenShift OAuth provider
        openshift:
          production:
            clientId: ${OPENSHIFT_OAUTH_CLIENT_ID}
            clientSecret: ${OPENSHIFT_OAUTH_CLIENT_SECRET}
            # OpenShift API URL (parameterized, will be replaced by script)
            baseUrl: ${OPENSHIFT_API_URL}
            # Callback URL for OpenShift OAuth
            callbackUrl: ${RHDH_BASE_URL}/api/auth/openshift/handler/frame
            signIn:
              resolvers:
                # Resolves the user entity from the OpenShift identity
                - resolver: usernameMatchingUserEntityName

    # Sign-in page configuration - allow users to choose between providers
    signInPage: openshift

    # Permission framework configuration
    permission:
      enabled: true
      rbacFile: /opt/app-root/src/rbac-policy.yaml

    # Catalog configuration
    catalog:
      import:
        entityFilename: catalog-info.yaml
      rules:
        - allow: [Component, System, API, Resource, Location, User, Group, Template]
      locations:
        - type: url
          target: https://github.com/janus-idp/backstage-showcase/blob/main/catalog-entities/all.yaml
