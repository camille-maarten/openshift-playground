apiVersion: v1
kind: Secret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  name: rhdh-secrets
  namespace: rhdh
type: Opaque
stringData:
  # Backend secret for authentication
  BACKEND_SECRET: "change-me-in-production-use-strong-secret"

  # PostgreSQL database credentials
  POSTGRES_HOST: "postgres-rhdh.rhdh.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "rhdh1234!"

  # Keycloak OIDC configuration
  # TEMPLATE: These placeholders will be replaced by update-keycloak-rhdh-config.sh
  # Format: https://keycloak-route (no trailing slash)
  KEYCLOAK_BASE_URL: "https://KEYCLOAK_ROUTE"
  KEYCLOAK_CLIENT_ID: "rhdh"
  KEYCLOAK_CLIENT_SECRET: "rhdh-client-secret-change-in-production"

  # Developer Hub base URL
  # Format: https://rhdh-route (no trailing slash)
  RHDH_BASE_URL: "https://RHDH_ROUTE"
