apiVersion: v1
kind: Secret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  name: rhdh-secrets
  namespace: rhdh
type: Opaque
stringData:
  # Backend secret for authentication
  BACKEND_SECRET: "change-me-in-production-use-strong-secret"

  # PostgreSQL database credentials
  POSTGRES_HOST: "postgres-rhdh.rhdh.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "rhdh1234!"
