---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/name: argocd-rbac-cm
    app.kubernetes.io/part-of: argocd
data:
  # Default policy for all users
  policy.default: role:readonly

  # CSV of RBAC policies
  policy.csv: |
    # Admin role - full access
    p, role:admin, *, *, */*, allow

    # Developer role - can manage applications
    p, role:developer, applications, *, */*, allow
    p, role:developer, repositories, get, *, allow
    p, role:developer, clusters, get, *, allow
    p, role:developer, projects, get, *, allow
    p, role:developer, logs, get, */*, allow
    p, role:developer, exec, create, */*, allow

    # Readonly role - read-only access
    p, role:readonly, *, get, */*, allow
    p, role:readonly, applications, list, */*, allow
    p, role:readonly, repositories, list, *, allow
    p, role:readonly, clusters, list, *, allow
    p, role:readonly, projects, list, *, allow

    # Grant admin role to cluster-admins and system:cluster-admins
    g, system:cluster-admins, role:admin
    g, cluster-admins, role:admin

    # Grant admin role to local admin-user account
    g, admin-user, role:admin

    # Grant developer role to specific groups (customize as needed)
    # g, developers, role:developer
    # g, your-openshift-group, role:developer

    # Grant readonly role to viewers
    # g, viewers, role:readonly

  # OIDC scopes to examine during rbac enforcement
  scopes: '[groups]'
