---
# ArgoCD Admin Password Secret Patch
# This patches the argocd-secret that is automatically created by the operator
# Apply this AFTER the ArgoCD instance is created
# Default password: argocd1234!
#
# The ArgoCD operator creates the argocd-secret automatically.
# We patch it with our desired password hash.
#
# To change the password after installation:
# 1. Generate new hash: htpasswd -nbBC 10 "" your-password | tr -d ':\n' | sed 's/$2y/$2a/'
# 2. Update this file with the new hash
# 3. Apply: oc apply -f 10-admin-password-secret.yaml
# 4. Restart ArgoCD server: oc delete pod -l app.kubernetes.io/name=openshift-gitops-server -n openshift-gitops

apiVersion: v1
kind: Secret
metadata:
  name: argocd-secret
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/name: argocd-secret
    app.kubernetes.io/part-of: argocd
type: Opaque
stringData:
  # Bcrypt hashed password for admin-user account
  # Default password: argocd1234!

  # Generated using: htpasswd -nbBC 10 "" 'argocd1234!' | tr -d ':\n' | sed 's/$2y/$2a/'
  admin.password: "$2a$10$62HiuFCsrohHM0r/MxVnyOnBbhhmfA/6BKAerK0jmLhQNmCHXdCPe"
  # Optional but recommended: bump this value when you change the password
  admin.passwordMtime: "2025-11-17T10:00:00Z"
  
  # Generated using: htpasswd -nbBC 10 "" 'argocd1234!' | tr -d ':\n' | sed 's/$2y/$2a/'
  accounts.admin-user.password: "$2a$10$62HiuFCsrohHM0r/MxVnyOnBbhhmfA/6BKAerK0jmLhQNmCHXdCPe"
  # Optional but recommended: bump this value when you change the password
  accounts.admin-user.passwordMtime: "2025-11-17T10:00:00Z"
