apiVersion: v1
kind: ResourceQuota
metadata:
  name: playground-quota
  namespace: playground
spec:
  hard:
    # Compute resources
    requests.cpu: "4"
    requests.memory: "8Gi"
    limits.cpu: "8"
    limits.memory: "16Gi"

    # Storage
    requests.storage: "50Gi"
    persistentvolumeclaims: "10"

    # Objects
    pods: "20"
    services: "10"
    configmaps: "20"
    secrets: "20"
    replicationcontrollers: "5"
    count/deployments.apps: "10"
    count/statefulsets.apps: "5"
    count/jobs.batch: "10"
