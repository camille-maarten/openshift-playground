---
# OAuth configuration to enable htpasswd authentication
# This patches the cluster OAuth configuration to add htpasswd as an identity provider
apiVersion: config.openshift.io/v1
kind: OAuth
metadata:
  name: cluster
  annotations:
    argocd.argoproj.io/sync-wave: "8"
    argocd.argoproj.io/sync-options: "IgnoreExtraneous=true"
spec:
  identityProviders:
    - name: rhoai-htpasswd
      mappingMethod: claim
      type: HTPasswd
      htpasswd:
        fileData:
          name: rhoai-htpasswd-secret
