---
# Keycloak Instance
# This creates a running Keycloak server instance using Red Hat Build of Keycloak
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # Number of Keycloak instances
  instances: 1

  # Database configuration - RHBK uses PostgreSQL
  db:
    vendor: postgres
    host: postgres
    usernameSecret:
      name: keycloak-db-secret
      key: username
    passwordSecret:
      name: keycloak-db-secret
      key: password

  # Ingress configuration - let OpenShift generate the route automatically
  ingress:
    enabled: true
    className: openshift-default

  # HTTP configuration
  http:
    httpEnabled: true
    # Trust proxy headers from OpenShift router
    httpsPort: 8443

  # Hostname configuration - uses OpenShift route
  hostname:
    strict: false
    strictBackchannel: false

  # Resource limits (optional)
  # resources:
  #   requests:
  #     memory: "512Mi"
  #     cpu: "500m"
  #   limits:
  #     memory: "1Gi"
  #     cpu: "1000m"
