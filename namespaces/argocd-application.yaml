apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: playground-namespaces
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    # Update this to point to your Git repository
    repoURL: https://gitea-gitea.apps.cluster-g44r2.g44r2.sandbox5397.opentlc.com/admin/playground-gitops.git
    targetRevision: main
    path: namespaces/manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
